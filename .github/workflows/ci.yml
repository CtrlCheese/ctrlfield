name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────
  # 1. Security gate
  # ─────────────────────────────────────────────────────────────────
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No hardcoded secrets
        run: |
          if grep -rE "(password|secret|api_key)\s*=\s*['\"][^'\"]{8,}" $(ls -d src pro/src 2>/dev/null) \
              --include="*.php" \
              --exclude-dir=vendor; then
            echo "::warning::Possible hardcoded credential detected — review before merging."
          fi

      - name: No placeholder RSA key
        if: hashFiles('pro/src/**') != ''
        run: |
          if grep -r "REPLACE_WITH_REAL_RSA2048_PUBLIC_KEY" pro/src/; then
            echo "::error::Replace the placeholder RSA public key in JwtLicenseValidator before shipping."
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────
  # 2. PHP static analysis
  # ─────────────────────────────────────────────────────────────────
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # ─────────────────────────────────────────────────────────────────
  # 3. PHP unit tests
  # ─────────────────────────────────────────────────────────────────
  unit:
    name: Unit tests / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests (Core)
        run: vendor/bin/phpunit --configuration phpunit.xml

      # Private repo only — the public Free build has no pro/.
      # Pro tests never ran before the merge (src/helpers.php exited without ABSPATH).
      # 36 of them fail on the pre-merge code too; non-blocking until those are fixed.
      - name: Run unit tests (Pro)
        if: hashFiles('pro/phpunit.xml') != ''
        continue-on-error: true
        run: vendor/bin/phpunit --configuration pro/phpunit.xml

  # ─────────────────────────────────────────────────────────────────
  # 4. JavaScript unit tests (Vitest)
  # ─────────────────────────────────────────────────────────────────
  js:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Run Vitest
        run: npm run test:js

  # ─────────────────────────────────────────────────────────────────
  # 5. PHP integration tests (wp-env, free plugin only)
  # ─────────────────────────────────────────────────────────────────
  integration:
    name: Integration tests (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Use CI wp-env config (free plugin only)
        run: cp .wp-env.ci.json .wp-env.json

      - name: Start wp-env
        run: npx @wordpress/env start

      - name: Run integration tests
        run: |
          npx @wordpress/env run tests-cli --env-cwd="wp-content/plugins/$(basename "$PWD")" \
            vendor/bin/phpunit --configuration phpunit-integration.xml --no-progress

      - name: Stop wp-env
        if: always()
        run: npx @wordpress/env stop

  # ─────────────────────────────────────────────────────────────────
  # 6. Build distribution zip (artifact — baixe para subir no LemonSqueezy)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build zip
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [security, phpstan, unit, js]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install deps (production)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      # Same result as wp dist-archive (honours .distignore), without WP-CLI.
      # In the public repo this is the Free zip; in the private repo, the full zip.
      - name: Build zip
        run: |
          mkdir -p dist/ctrlfield
          rsync -a --exclude-from=.distignore --exclude=dist ./ dist/ctrlfield/
          (cd dist && zip -qr ../ctrlfield.zip ctrlfield)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ctrlfield-${{ github.sha }}
          path: ctrlfield.zip
          retention-days: 30
