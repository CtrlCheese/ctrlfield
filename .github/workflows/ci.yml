name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────────────────────────────────────────
  # 1. Security gate
  # ─────────────────────────────────────────────────────────────────
  security:
    name: Security checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: No hardcoded secrets
        run: |
          if grep -rE "(password|secret|api_key)\s*=\s*['\"][^'\"]{8,}" $(ls -d src pro/src 2>/dev/null) \
              --include="*.php" \
              --exclude-dir=vendor; then
            echo "::warning::Possible hardcoded credential detected — review before merging."
          fi

      - name: No placeholder RSA key
        if: hashFiles('pro/src/**') != ''
        run: |
          if grep -r "REPLACE_WITH_REAL_RSA2048_PUBLIC_KEY" pro/src/; then
            echo "::error::Replace the placeholder RSA public key in JwtLicenseValidator before shipping."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      # Known vulnerabilities in what we ship: PHP packages (vendor/ is in the
      # zip) and the JS bundled into assets/. Fails the build.
      - name: Dependency audit (shipped code)
        run: |
          composer audit --no-dev
          npm audit --omit=dev --audit-level=high

      # Build and test tools never reach users' sites: reported, not blocking.
      - name: Dependency audit (dev tools)
        continue-on-error: true
        run: |
          composer audit
          npm audit --audit-level=high

      # Escaping, nonces, sanitizing, SQL (.phpcs.xml.dist). Findings already
      # reviewed are in phpcs.baseline.xml; anything new fails the build.
      - name: PHPCS security sniffs
        run: vendor/bin/phpcs

      # Follows $_GET / $_POST / database values into HTML, SQL, headers, files
      # and shell. Installed outside composer.json (see psalm.xml).
      - name: Taint analysis (Psalm)
        run: |
          # The public Free repo has no pro/: analyse what exists.
          [ -d pro/src ] || sed -i '/pro\/src/d' psalm.xml
          mkdir -p "$RUNNER_TEMP/psalm"
          composer --working-dir="$RUNNER_TEMP/psalm" require --no-interaction --no-progress "vimeo/psalm:^6.0"
          "$RUNNER_TEMP/psalm/vendor/bin/psalm" --taint-analysis --no-progress --output-format=github

  # ─────────────────────────────────────────────────────────────────
  # 2. PHP static analysis
  # ─────────────────────────────────────────────────────────────────
  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  # ─────────────────────────────────────────────────────────────────
  # 3. PHP unit tests
  # ─────────────────────────────────────────────────────────────────
  unit:
    name: Unit tests / PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run unit tests (Core)
        run: vendor/bin/phpunit --configuration phpunit.xml

      # Private repo only — the public Free build has no pro/.
      - name: Run unit tests (Pro)
        if: hashFiles('pro/phpunit.xml') != ''
        run: vendor/bin/phpunit --configuration pro/phpunit.xml

  # ─────────────────────────────────────────────────────────────────
  # 4. JavaScript unit tests (Vitest)
  # ─────────────────────────────────────────────────────────────────
  js:
    name: JS tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Run Vitest
        run: npm run test:js

  # ─────────────────────────────────────────────────────────────────
  # 5. PHP integration tests (wp-env, free plugin only)
  # ─────────────────────────────────────────────────────────────────
  # WordPress latest must pass. Nightly (the next release) may fail without
  # blocking: it is the early warning that something will break.
  integration:
    name: Integration tests / WP ${{ matrix.wp }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.wp == 'nightly' }}
    strategy:
      fail-fast: false
      matrix:
        wp: ['latest', 'nightly']
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install Node deps
        run: npm ci

      - name: Install PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress

      # The WordPress test suite runs on PHPUnit 9 and needs the PHPUnit
      # Polyfills; unit tests keep PHPUnit 11 (composer.json is not changed).
      - name: PHPUnit 9 + Polyfills for the WordPress test suite
        run: composer require --dev --no-interaction --no-progress -W "phpunit/phpunit:^9.6" "yoast/phpunit-polyfills:^2.0"

      - name: Use CI wp-env config (free plugin only)
        run: cp .wp-env.ci.json .wp-env.json

      - name: Start wp-env
        run: |
          if [ "${{ matrix.wp }}" = "nightly" ]; then export WP_ENV_CORE="WordPress/WordPress#master"; fi
          npx @wordpress/env start

      - name: Run integration tests
        run: |
          npx @wordpress/env run tests-cli --env-cwd="wp-content/plugins/$(basename "$PWD")" \
            vendor/bin/phpunit --configuration phpunit-integration.xml

      - name: Stop wp-env
        if: always()
        run: npx @wordpress/env stop

  # ─────────────────────────────────────────────────────────────────
  # 6. Build distribution zip (artifact — baixe para subir no LemonSqueezy)
  # ─────────────────────────────────────────────────────────────────
  build:
    name: Build zip
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    needs: [security, phpstan, unit, js]
    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: Install deps (production)
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      # Same result as wp dist-archive (honours .distignore), without WP-CLI.
      # In the public repo this is the Free zip; in the private repo, the full zip.
      - name: Build zip
        run: |
          mkdir -p dist/ctrlfield
          rsync -a --exclude-from=.distignore --exclude=dist ./ dist/ctrlfield/
          (cd dist && zip -qr ../ctrlfield.zip ctrlfield)

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: ctrlfield-${{ github.sha }}
          path: ctrlfield.zip
          retention-days: 30
