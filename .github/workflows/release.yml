# Builds the distributable zip on a version tag and publishes it as a GitHub
# Release asset — the permanent, versioned source the plugin updater reads.
#
# This file is mirrored to the public repo (mirror-public.yml strips only
# itself), so one workflow serves both:
#   - private repo (CtrlCheese/ctrlfield-pro): the zip contains pro/  → Pro build
#   - public  repo (CtrlCheese/ctrlfield):     no pro/ in the tree    → Free build
# Same slug, same asset name; the two come from different repos.
#
# Tag to release:  git tag v1.0.1 && git push origin v1.0.1
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write  # create the GitHub Release and upload the asset

concurrency: release-${{ github.ref }}

jobs:
  release:
    name: Build zip and publish release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          header="$(sed -n "s/.*Version:[[:space:]]*//p" ctrlfield.php | head -1 | tr -d '[:space:]')"
          const="$(sed -n "s/.*CTRLFIELD_VERSION'[, ]*'\([^']*\)'.*/\1/p" ctrlfield.php | head -1)"
          echo "tag=$tag  header=$header  const=$const"
          if [ "$tag" != "$header" ] || [ "$tag" != "$const" ]; then
            echo "::error::Tag $GITHUB_REF_NAME must match the plugin header ($header) and CTRLFIELD_VERSION ($const)."
            exit 1
          fi

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none
          tools: composer

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install production PHP deps
        run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: Build front-end assets
        run: |
          npm ci
          npm run build

      # Same result as `wp dist-archive` (honours .distignore), without WP-CLI.
      - name: Build zip
        run: |
          mkdir -p dist/ctrlfield
          rsync -a --exclude-from=.distignore --exclude=dist ./ dist/ctrlfield/
          (cd dist && zip -qr ../ctrlfield.zip ctrlfield)

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ctrlfield.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
