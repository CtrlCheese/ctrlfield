name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Do not open an issue: see SECURITY.md."
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what happened instead. Include error messages.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: A minimal schema file or the admin steps that show the problem.
      render: php
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "CtrlField 1.0.0 · WordPress 6.8 · PHP 8.3"
    validations:
      required: true
  - type: dropdown
    id: plan
    attributes:
      label: Plan
      options: [Free, Pro]
